name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [firmware/telemetry-sd, firmware/telemetry-nosd, firmware/browser-logger, diagnostics/sd_usb_probe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: pio run -d "${{ matrix.project }}"
      - if: matrix.project == 'firmware/browser-logger'
        run: pio run -d firmware/browser-logger --target buildfs
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q dashboard tools firmware/browser-logger/download_tiles.py
